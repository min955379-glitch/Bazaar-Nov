<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bazaar Admin</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="header-inner"><span class="brand">Bazaar <span class="brand-tag">Admin</span></span><div class="header-actions"><a id="view-website" class="secondary-btn website-link" target="_blank" rel="noopener noreferrer" hidden><span class="website-full">View website</span><span class="website-short">Website</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5h6v6M19 5l-9 9M19 14v5H5V5h5"/></svg></a><button id="sign-out" class="secondary-btn" type="button" hidden>Sign out</button><button id="theme-toggle" class="secondary-btn theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">☀</button></div></div></header>
<main class="page">
<section id="login" class="gate-wrap"><div class="gate-card"><div class="content"><h1>Admin sign in</h1><form id="login-form" class="gate-form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" autocapitalize="none" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="login-error" class="message error" role="alert"></p><button id="login-button" class="primary-btn" disabled>Checking session…</button></form></div></div></section>
<section id="dashboard" hidden><div id="list-view"><div class="dash-head"><div><h1>Admin panel</h1><p>Manage the catalog securely.</p></div><button id="add" type="button" class="primary-btn">Add product</button></div><div class="kpis"><div class="kpi"><div class="label">Products</div><div id="total-count" class="value">–</div></div><div class="kpi"><div class="label">In stock</div><div id="stock-count" class="value">–</div></div><div class="kpi"><div class="label">Out of stock</div><div id="out-count" class="value">–</div></div></div><p id="list-message" class="message" role="status"></p><p id="save-success" class="message" role="status" hidden></p><button id="retry" class="secondary-btn" type="button" hidden>Retry</button><div id="product-list"></div></div>
<form id="product-form" class="editor" hidden><h2 id="form-title">Add product</h2><div class="form-grid"><div class="field"><label for="name">Name</label><input id="name" maxlength="120" minlength="2" required></div><div class="field"><label for="price">Price (PKR)</label><input id="price" type="number" min="0.01" max="10000000" step="0.01" required></div></div><div class="field"><label for="description">Description</label><textarea id="description" rows="4" required></textarea></div><label class="stock-check"><input id="in-stock" type="checkbox" checked> In stock</label><div class="field"><label for="photos">Product photos (2 to 3)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple><p class="hint">Photos are compressed before upload. Add at least two.</p><div id="image-list" class="image-grid"></div></div><p id="form-error" class="message error" role="alert"></p><div class="form-actions"><button id="save" type="submit" class="primary-btn">Save product</button><button id="cancel" type="button" class="secondary-btn">Cancel</button></div></form></section>
</main><script src="assets/vendor/supabase.js"></script><script type="module" src="app.js"></script></body></html>
